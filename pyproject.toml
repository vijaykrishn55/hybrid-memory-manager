[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hybrid-memory-manager"
version = "1.0.0"
description = "Local-first hybrid memory architecture for LLM applications"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "scikit-learn>=1.3",
  "tiktoken>=0.6.0",
  "pydantic>=2.6.0",
]

[project.optional-dependencies]
semantic = ["sentence-transformers>=3.0"]
test = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
